<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MindMap</title>
<style>
  :root{
    --bg:#F6F7F9;
    --panel:#FFFFFF;
    --line:#DDE1E6;
    --ink:#20232A;
    --sub:#828A96;
    --accent:#3D5AFE;
    --danger:#FF4D6D;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Yu Gothic","Segoe UI",sans-serif;
  }

  /* ---- toolbar ---- */
  #toolbar{
    position:fixed; top:14px; left:14px; z-index:1000;
    display:flex; align-items:center; gap:6px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px;
    box-shadow:0 2px 10px rgba(20,20,30,0.05);
  }
  .btn{
    border:none; background:transparent;
    border-radius:8px;
    padding:8px 12px;
    font-size:13px; font-weight:600;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s ease, color .12s ease;
  }
  .btn:hover{ background:#EEF0F4; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.primary:hover{ background:#2f47d6; }
  .btn.on{ background:var(--danger); color:#fff; }
  .btn.on:hover{ background:#e8385a; }
  .sep{ width:1px; height:22px; background:var(--line); margin:0 2px; }

  #hint{
    position:fixed; bottom:14px; left:14px; z-index:1000;
    font-size:12px; line-height:1.7; color:var(--sub);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:8px 12px;
  }

  #zoomctl{
    position:fixed; bottom:14px; right:14px; z-index:1000;
    display:flex; gap:4px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    box-shadow:0 2px 10px rgba(20,20,30,0.05);
  }

  /* ---- canvas ---- */
  #canvas-wrapper{
    width:100vw; height:100vh;
    overflow:hidden;
    cursor:grab;
  }
  #canvas-wrapper.panning{ cursor:grabbing; }
  #canvas{
    position:absolute;
    transform-origin:0 0;
  }
  svg#lines{
    position:absolute;
    overflow:visible;
    pointer-events:none;
  }
  path.link{
    fill:none;
    stroke-width:2.5;
    opacity:.55;
  }

  .node{
    position:absolute;
    padding:9px 16px;
    border-radius:10px;
    background:var(--panel);
    border:2px solid var(--node-color, var(--accent));
    color:var(--ink);
    font-size:14px;
    font-weight:600;
    cursor:grab;
    white-space:pre;
    user-select:text;
    min-width:40px;
    box-shadow:0 1px 2px rgba(20,20,30,0.06);
  }
  .node:active{ cursor:grabbing; }
  .node:focus{ outline:none; box-shadow:0 0 0 3px rgba(61,90,254,0.18); }
  .node.root{
    background:var(--node-color,var(--accent));
    color:#fff;
    font-size:16px;
    padding:12px 20px;
    border-radius:14px;
  }
  .node.selected{
    box-shadow:0 0 0 3px rgba(61,90,254,0.28), 0 1px 2px rgba(20,20,30,0.06);
  }
  #canvas-wrapper.delete-mode .node{ cursor:pointer; }
</style>
</head>
<body>

<div id="toolbar">
  <button class="btn primary" id="addChildBtn">＋子ノード</button>
  <button class="btn" id="addSiblingBtn">＋兄弟ノード</button>
  <div class="sep"></div>
  <button class="btn" id="saveBtn">保存</button>
  <button class="btn" id="loadBtn">読み込み</button>
  <div class="sep"></div>
  <button class="btn" id="deleteModeBtn">🗑 削除モード</button>
  <input type="file" id="fileInput" accept="application/json" style="display:none">
</div>

<div id="hint">
  トピックを1回タップして選択 → 空いている場所をダブルタップで子ノードを追加<br>
  上のボタンでも子/兄弟ノードを追加できます。ドラッグで移動、背景ドラッグで画面移動、右クリック/長押しで削除
</div>

<div id="zoomctl">
  <button class="btn" id="zoomOut">－</button>
  <button class="btn" id="zoomIn">＋</button>
</div>

<div id="canvas-wrapper">
  <svg id="lines"></svg>
  <div id="canvas"></div>
</div>

<script>
(function(){
  const wrapper = document.getElementById('canvas-wrapper');
  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('lines');

  let nodes = [];
  let connections = [];
  let scale = 1;
  let panX = 0, panY = 0;
  let deleteMode = false;
  let selectedNode = null;

  const branchColors = ['#3D5AFE','#00B37E','#FF7A45','#B15CDE','#F2B705','#FF4D6D','#00A8C2'];

  function applyTransform(){
    canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    svg.style.transform = canvas.style.transform;
  }

  function toggleDeleteMode(){
    deleteMode = !deleteMode;
    document.getElementById('deleteModeBtn').classList.toggle('on', deleteMode);
    wrapper.classList.toggle('delete-mode', deleteMode);
  }

  function selectNode(div){
    if (selectedNode) selectedNode.classList.remove('selected');
    selectedNode = div;
    if (selectedNode) selectedNode.classList.add('selected');
  }

  function createNode(text, x, y, parent=null){
    const div = document.createElement('div');
    div.className = 'node' + (parent ? '' : (nodes.length===0 ? ' root' : ''));
    div.contentEditable = true;
    div.innerText = text || '新しいトピック';
    div.style.left = x + 'px';
    div.style.top = y + 'px';
    div.dataset.id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
    div.dataset.color = parent ? parent.dataset.color : branchColors[nodes.length % branchColors.length];
    div.style.setProperty('--node-color', div.dataset.color);

    canvas.appendChild(div);
    nodes.push(div);

    if (parent) connections.push({ from: parent.dataset.id, to: div.dataset.id });

    makeDraggable(div);
    bindNodeEvents(div);
    updateLines();
    return div;
  }

  function deleteNode(node){
    const toRemove = new Set([node.dataset.id]);
    let grew = true;
    while (grew) {
      grew = false;
      connections.forEach(c => {
        if (toRemove.has(c.from) && !toRemove.has(c.to)) { toRemove.add(c.to); grew = true; }
      });
    }
    nodes = nodes.filter(n => {
      if (toRemove.has(n.dataset.id)) { n.remove(); return false; }
      return true;
    });
    connections = connections.filter(c => !toRemove.has(c.from) && !toRemove.has(c.to));
    if (selectedNode && toRemove.has(selectedNode.dataset.id)) selectedNode = null;
    updateLines();
  }

  function bindNodeEvents(div){
    div.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const count = connections.filter(c => c.from === div.dataset.id).length;
        const child = createNode('新しいトピック', div.offsetLeft + 200, div.offsetTop + count*64, div);
        selectNode(child);
        child.focus();
        document.execCommand('selectAll', false, null);
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const count = connections.filter(c => c.from === div.dataset.id).length;
        const child = createNode('新しいトピック', div.offsetLeft + 200, div.offsetTop + count*64, div);
        selectNode(child);
        child.focus();
        document.execCommand('selectAll', false, null);
      }
    });
    div.addEventListener('blur', updateLines);
    div.addEventListener('input', updateLines);

    div.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (confirm('このノードと子ノードを削除しますか？')) deleteNode(div);
    });

    div.addEventListener('click', (e) => {
      e.stopPropagation();
      if (deleteMode) {
        deleteNode(div);
      } else {
        selectNode(div);
      }
    });

    let touchTimer;
    div.addEventListener('touchstart', () => {
      touchTimer = setTimeout(() => {
        if (confirm('このノードと子ノードを削除しますか？')) deleteNode(div);
      }, 600);
    });
    div.addEventListener('touchend', () => clearTimeout(touchTimer));
    div.addEventListener('touchmove', () => clearTimeout(touchTimer));
  }

  function makeDraggable(el){
    let offsetX, offsetY, dragging = false;

    const start = (e) => {
      if (deleteMode) return;
      const t = e.touches ? e.touches[0] : e;
      offsetX = t.clientX - el.offsetLeft*scale;
      offsetY = t.clientY - el.offsetTop*scale;
      dragging = true;
      e.stopPropagation();
    };
    const move = (e) => {
      if (!dragging) return;
      const t = e.touches ? e.touches[0] : e;
      el.style.left = ((t.clientX - offsetX)/scale) + 'px';
      el.style.top = ((t.clientY - offsetY)/scale) + 'px';
      updateLines();
    };
    const end = () => { dragging = false; };

    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, { passive:true });
    document.addEventListener('mousemove', move);
    document.addEventListener('touchmove', move, { passive:true });
    document.addEventListener('mouseup', end);
    document.addEventListener('touchend', end);
  }

  function updateLines(){
    svg.innerHTML = '';
    connections.forEach(c => {
      const from = nodes.find(n => n.dataset.id === c.from);
      const to = nodes.find(n => n.dataset.id === c.to);
      if (!from || !to) return;
      const x1 = from.offsetLeft + from.offsetWidth/2;
      const y1 = from.offsetTop + from.offsetHeight/2;
      const x2 = to.offsetLeft + to.offsetWidth/2;
      const y2 = to.offsetTop + to.offsetHeight/2;
      const mx = (x1+x2)/2;
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class','link');
      path.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
      path.setAttribute('stroke', from.dataset.color);
      svg.appendChild(path);
    });
  }

  // ---- 背景パン ----
  let panning = false, panStart = null, panOrig = null;
  wrapper.addEventListener('mousedown', (e) => {
    if (e.target !== wrapper && e.target !== canvas) return;
    panning = true;
    wrapper.classList.add('panning');
    panStart = { x:e.clientX, y:e.clientY };
    panOrig = { x:panX, y:panY };
  });
  window.addEventListener('mousemove', (e) => {
    if (!panning) return;
    panX = panOrig.x + (e.clientX - panStart.x);
    panY = panOrig.y + (e.clientY - panStart.y);
    applyTransform();
  });
  window.addEventListener('mouseup', () => { panning = false; wrapper.classList.remove('panning'); });

  // ---- ズーム ----
  wrapper.addEventListener('wheel', (e) => {
    e.preventDefault();
    const prevScale = scale;
    scale = Math.min(3, Math.max(0.3, scale - e.deltaY*0.001));
    const rect = wrapper.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    panX = mx - (mx - panX) * (scale/prevScale);
    panY = my - (my - panY) * (scale/prevScale);
    applyTransform();
  }, { passive:false });

  document.getElementById('zoomIn').onclick = () => { scale = Math.min(3, scale*1.15); applyTransform(); };
  document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.3, scale*0.85); applyTransform(); };

  // ---- ダブルタップ/ダブルクリックで新規ノード(選択中なら子として追加) ----
  wrapper.addEventListener('dblclick', (e) => {
    if (e.target !== wrapper && e.target !== canvas) return;
    const rect = wrapper.getBoundingClientRect();
    const x = (e.clientX - rect.left - panX) / scale;
    const y = (e.clientY - rect.top - panY) / scale;
    const n = selectedNode
      ? createNode('新しいトピック', x, y, selectedNode)
      : createNode('新しいトピック', x, y);
    selectNode(n);
    n.focus();
    document.execCommand('selectAll', false, null);
  });
  document.getElementById('addChildBtn').onclick = () => {
    const base = selectedNode || nodes[0];
    if (!base) return;
    const count = connections.filter(c => c.from === base.dataset.id).length;
    const angle = (count * 47) % 360 * Math.PI / 180;
    const child = createNode('新しいトピック', base.offsetLeft + 40 + Math.cos(angle)*40, base.offsetTop + 90 + count*10, base);
    selectNode(child);
  };
  document.getElementById('addSiblingBtn').onclick = () => {
    const base = selectedNode || nodes[0];
    if (!base) return;
    const parentId = connections.find(c => c.to === base.dataset.id)?.from;
    const parent = parentId ? nodes.find(n => n.dataset.id === parentId) : null;
    const sib = parent
      ? createNode('新しいトピック', base.offsetLeft + 60, base.offsetTop + 80, parent)
      : createNode('新しいトピック', base.offsetLeft + 60, base.offsetTop + 80);
    selectNode(sib);
  };

  // ---- 削除モード ----
  document.getElementById('deleteModeBtn').onclick = toggleDeleteMode;

  // ---- 保存 / 読み込み ----
  document.getElementById('saveBtn').onclick = () => {
    const data = {
      nodes: nodes.map(n => ({
        id: n.dataset.id, text: n.innerText,
        x: n.offsetLeft, y: n.offsetTop,
        color: n.dataset.color,
        isRoot: n.classList.contains('root')
      })),
      connections
    };
    const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mindmap.json';
    a.click();
  };
  document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const data = JSON.parse(evt.target.result);
      canvas.innerHTML = '';
      nodes = [];
      connections = data.connections || [];
      (data.nodes || []).forEach(n => {
        const div = document.createElement('div');
        div.className = 'node' + (n.isRoot ? ' root' : '');
        div.contentEditable = true;
        div.innerText = n.text;
        div.style.left = n.x + 'px';
        div.style.top = n.y + 'px';
        div.dataset.id = n.id;
        div.dataset.color = n.color;
        div.style.setProperty('--node-color', n.color);
        canvas.appendChild(div);
        nodes.push(div);
        makeDraggable(div);
        bindNodeEvents(div);
      });
      updateLines();
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---- 初期ノード ----
  const root = createNode('メインテーマ', window.innerWidth/2 - 60, window.innerHeight/2 - 20);
  createNode('トピック1', root.offsetLeft - 260, root.offsetTop - 120, root);
  createNode('トピック2', root.offsetLeft + 260, root.offsetTop - 100, root);
  createNode('トピック3', root.offsetLeft - 220, root.offsetTop + 160, root);
  createNode('トピック4', root.offsetLeft + 240, root.offsetTop + 160, root);
  selectNode(root);
  updateLines();
  applyTransform();
})();
</script>
</body>
</html>
